name: dt4acc build

on:
  push:
    branches:
      - dev/main

  pull_request:
    branches:
      - dev/main

permissions:
  contents: read

jobs:
  wrap_and_build:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

        numpy-version:
          - "numpy<2.0"
          - "numpy>=2.0"

    steps:
      #
      # Checkout repositories
      #
      - name: Checkout dt4acc
        uses: actions/checkout@v6

      - name: Checkout dt4acc-lib
        uses: actions/checkout@v6
        with:
          repository: dt4acc/dt4acc-lib
          path: dt4acc-lib

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
            dt4acc-lib/pyproject.toml
            dt4acc-lib/requirements*.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pytest flake8 pycodestyle "${{ matrix.numpy-version }}"

      - name: Buiild wheel for  dt4acc-lib
        run: |
          python -m pip wheel --wheel-dir wheel/ ./dt4acc-lib

      - name: Build wheel
        run: |
          find wheel/ -name 'dt4acc*'
          python -m pip install wheel/dt4acc_lib*.whl
          python3 -c "import dt4acc_lib"
          echo "Building dt4acc wheel"
          python -m pip wheel --wheel-dir wheel/ wheel/dt4acc_lib*.whl ./

      - name: Install dt4acc from wheel
        run: |
          find wheel/ -name 'dt4acc*'
          python -m pip install wheel/dt4acc_lib*.whl wheel/dt4acc-*.whl

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/dt4acc --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 src/dt4acc --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

