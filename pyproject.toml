[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lat2db"
version = "0.0.1"
description = "Storing accelerator lattices as json in mongo"
authors = [  "Waheedullah Sulaiman Khail", "Pierre Schnizer"]
license = "GPL-3.0"
homepage = "https://github.com/hz-b/dt4acc"
documentation = "https://github.com/hz-b/dt4acc"
repository = "https://github.com/hz-b/dt4acc.git"
keywords = []
classifiers = [
     "Development Status :: 4 - Beta",
     "Intended Audience :: Science/Research",
     "License :: OSI Approved :: GNU General Public License (GPL)",
     "Programming Language :: Python :: 3",
     "Topic :: Scientific/Engineering :: Physics"
]

[tool.poetry.dependencies]
python = ">=3.7"
accelerator-toolbox="*"
numpy="*"
pymongo="*"
# fastapi="*"
# pydantic="*"
# jsons="*"
# uuid="*"
# pytest="*"
# attrs="*"
# uvicorn="*"
# httpx="*"
# lark="*"
