[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dt4acc"
version = "0.2.0"
description = "digital twin for accelerators"
authors = [
  { name = "Waheedullah Sulaiman Khail" },
  { name = "Pierre Schnizer" },
]
license = { text = "GPL-3.0" }
requires-python = ">=3.7"
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License (GPL)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "dt4acc-lib",
    "transitions",
    "accelerator-toolbox"
]

# Todo: fix that I don't need to give a specific path

[project.urls]
Homepage = "https://github.com/dt4acc/dt4acc"
Documentation = "https://github.com/dt4acc/dt4acc"
Repository = "https://github.com/dt4acc/dt4acc.git"

[project.optional-dependencies]
docs = [
  "Sphinx==4.2.0",
  "sphinx-rtd-theme==1.0.0",
  "sphinxcontrib-napoleon==0.7",
]

epics = [
     "softioc>4.1",
     "p4p"
]

tango = [
     "pytango"
]

bessyii = [
    "lat2db"
]
[project.scripts]
dt4acc_bessyii = "dt4acc.custom_facility.bessyii.run_bessyii_twin:main"
dt4acc_soleil = "dt4acc.custom_facility.soleil.run_soleil_twin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dt4acc"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
